<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Claude Code Exporter</title>
<style>
  body { width: 300px; margin: 0; font: 14px/1.5 system-ui; color: #272421; background: #faf8f4; }
  main { padding: 20px; }
  header { display: flex; align-items: center; gap: 10px; }
  img { width: 32px; height: 32px; border-radius: 7px; }
  h1 { margin: 0; font-size: 18px; }
  p { margin: 14px 0; }
  button { width: 100%; padding: 10px 16px; border: 0; border-radius: 7px; font: 600 14px system-ui; cursor: pointer; color: white; background: #c34f19; }
  button:hover { background: #a94014; }
  button:disabled { cursor: wait; opacity: .65; }
  #status { overflow-wrap: anywhere; }
</style>
<main>
  <header><img src="icons/icon-32.png" alt=""><h1>Export this session</h1></header>
  <p>Save the complete Claude Code history as one Markdown file. Keep this tab open until it finishes.</p>
  <button id="download" type="button">Download Markdown</button>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script src="popup.js"></script>
</html>
